[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "SIM"]
ignore = [
    "E501",  # Line length handled by formatter
    "B008",  # Allow FastAPI File/Form/Depends in route signatures
    "B904",  # Allow HTTPException without explicit 'from'
    "S101",  # Allow assert in tests
    "S104",  # Allow 0.0.0.0 binding for Cloud Run container
    "S108",  # Allow /tmp for container ephemeral storage
    "S603",  # Allow subprocess
    "S607",  # Allow partial path
    "UP042", # Allow str, Enum inheritance for schema stability
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
